<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Friends Forever - Mobile App</title>
    <!-- PWA & Mobile Optimization -->
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #131c2e;
            --accent-green: #10b981;
            --text-white: #f8fafc;
            --text-gray: #94a3b8;
            --border-color: #1e293b;
        }
        body {
            margin: 0; padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color); color: var(--text-white);
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .app-container-full {
            width: 100%; max-width: 430px; height: 100vh; max-height: 900px;
            background-color: var(--bg-color); display: flex; flex-direction: column;
            overflow: hidden; position: relative;
        }
        .status-bar {
            height: 40px; display: flex; justify-content: space-between; align-items: center;
            padding: 0 20px; font-size: 13px; font-weight: 600; background: var(--bg-color);
            color: var(--text-white); z-index: 10;
        }
        .app-body { flex: 1; overflow-y: auto; padding: 15px 20px; box-sizing: border-box; padding-bottom: 80px; }
        .screen { display: none; }
        .screen.active { display: block; }
        .auth-container { text-align: center; margin-top: 30px; }
        .auth-container h1 { color: var(--accent-green); font-size: 28px; margin-bottom: 5px; }
        .input-box {
            width: 100%; padding: 14px; margin: 10px 0; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; color: white;
            box-sizing: border-box; font-size: 14px;
        }
        .main-btn {
            width: 100%; padding: 14px; background: var(--accent-green); border: none;
            border-radius: 12px; color: #000; font-weight: bold; font-size: 16px;
            cursor: pointer; margin-top: 10px;
        }
        .divider {
            display: flex; align-items: center; text-align: center; margin: 20px 0;
            color: var(--text-gray); font-size: 12px;
        }
        .divider::before, .divider::after { content: ''; flex: 1; border-bottom: 1px solid var(--border-color); }
        .divider::before { margin-right: 10px; }
        .divider::after { margin-left: 10px; }
        .social-btn {
            width: 100%; padding: 12px; margin: 8px 0; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; color: white;
            font-size: 14px; font-weight: 600; cursor: pointer;
        }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .wallet-badge {
            background: var(--card-bg); padding: 6px 14px; border-radius: 20px;
            font-size: 13px; color: var(--accent-green); border: 1px solid var(--accent-green);
            font-weight: bold;
        }
        .section-heading { font-size: 15px; font-weight: bold; margin-bottom: 12px; color: var(--text-white); }
        .room-box {
            background: var(--card-bg); padding: 15px; border-radius: 16px;
            border: 1px solid var(--border-color); margin-bottom: 15px;
        }
        .room-actions { display: flex; gap: 10px; margin-top: 12px; }
        .room-btn {
            flex: 1; padding: 8px; background: #1e293b; border: none;
            border-radius: 8px; color: white; font-size: 12px; cursor: pointer;
        }
        .room-btn.join { background: var(--accent-green); color: #000; font-weight: bold; }
        .list-item {
            background: var(--card-bg); padding: 12px; border-radius: 12px; margin-bottom: 10px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid var(--border-color);
        }
        .bottom-nav {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 65px;
            background: #0b0f19; border-top: 1px solid var(--border-color);
            display: flex; justify-content: space-around; align-items: center; z-index: 100;
        }
        .nav-item { text-align: center; color: var(--text-gray); font-size: 10px; cursor: pointer; }
        .nav-item.active { color: var(--accent-green); font-weight: bold; }
    </style>
</head>
<body>
<div class="app-container-full">
  <div class="status-bar"><span>10:30</span><div class="icons"><span>5G</span> <span>🔋</span></div></div>

  <div class="app-body">
    <div id="authScreen" class="screen active">
      <div class="auth-container">
        <h1>Friends Forever</h1>
        <p style="color:#94a3b8;font-size:13px;margin-bottom:20px;">Connect, Chat & Earn Together</p>
        <input type="text" class="input-box" placeholder="Enter Your Name" id="userNameInput">
        <input type="tel" class="input-box" placeholder="Mobile Number (+92...)" id="userPhoneInput">
        <button class="main-btn" onclick="requestFirebaseOTP()">Send OTP</button>
        <div class="divider">OR</div>
        <button class="social-btn" onclick="firebaseGoogleLogin()">Continue with Google</button>
        <button class="social-btn" onclick="firebaseFacebookLogin()">Continue with Facebook</button>
      </div>
    </div>
    <div id="otpScreen" class="screen">
      <div class="auth-container">
        <h1>Verify OTP</h1>
        <input type="text" class="input-box" placeholder="Enter 6-Digit OTP" id="otpInput" maxlength="6">
        <button class="main-btn" onclick="verifyFirebaseOTP()">Verify & Register</button>
        <button class="room-btn" style="width:100%;margin-top:15px;background:transparent;color:#94a3b8;" onclick="backToAuth()">Back</button>
      </div>
    </div>

    <div id="homeScreen" class="screen">
      <div class="header">
        <div class="user-info">
          <h3 id="welcomeText">Hello, User!</h3>
          <span id="userPhoneDisplay">Online</span>
        </div>
        <div class="wallet-badge">💎 1,250 Gems</div>
      </div>
      <div class="section-heading">Live Rooms & Parties</div>
      <div class="room-box">
        <strong>🎉 Late Night Fun Lounge</strong>
        <div class="room-actions">
          <button class="room-btn">Voice Call</button>
          <button class="room-btn join">Join Room</button>
        </div>
      </div>
    </div>
    <div id="discoverScreen" class="screen">
      <div class="section-heading">Discover Users</div>
      <div class="list-item"><strong>Sara</strong><button class="room-btn join" style="padding:5px 10px;">View</button></div>
    </div>

    <div id="chatsScreen" class="screen">
      <div class="section-heading">Chats</div>
      <div class="list-item"><strong>Support Team</strong><span style="color:#10b981;">Now</span></div>
    </div>
  </div>
  <div class="bottom-nav" id="bottomNav" style="display:none;">
    <div class="nav-item active" onclick="switchTab('home', this)">🏠<br>Home</div>
    <div class="nav-item" onclick="switchTab('discover', this)">🔍<br>Discover</div>
    <div class="nav-item" onclick="switchTab('chats', this)">💬<br>Chats</div>
    <div class="nav-item" onclick="logout()">🚪<br>Logout</div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, FacebookAuthProvider } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyD-GFOH9ydfauQfYB9Oe9lp1vfYyKwVmNo",
  authDomain: "friendsforever-fa90c.firebaseapp.com",
  projectId: "friendsforever-fa90c",
  storageBucket: "friendsforever-fa90c.firebasestorage.app",
  messagingSenderId: "936587551748",
  appId: "1:936587551748:web:518800ccb62d53a7770151"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Handle Firebase Redirect Login
getRedirectResult(auth)
  .then((res) => {
    if (res && res.user) {
      handleSuccessfulLogin(res.user.displayName, res.user.email);
    }
  }).catch((err) => {
    alert(err.message);
  });

window.firebaseGoogleLogin = function() {
  signInWithRedirect(auth, new GoogleAuthProvider());
};

window.firebaseFacebookLogin = function() {
  signInWithRedirect(auth, new FacebookAuthProvider());
};
window.requestFirebaseOTP = function() {
  if (!document.getElementById('userNameInput').value || !document.getElementById('userPhoneInput').value) {
    alert('Please fill all fields');
    return;
  }
  document.getElementById('authScreen').classList.remove('active');
  document.getElementById('otpScreen').classList.add('active');
};

window.verifyFirebaseOTP = function() {
  handleSuccessfulLogin(
    document.getElementById('userNameInput').value,
    document.getElementById('userPhoneInput').value
  );
};

window.handleSuccessfulLogin = function(name, info) {
  localStorage.setItem('ff_username', name);
  localStorage.setItem('ff_info', info);

  document.getElementById('welcomeText').innerText = "Hello, " + name + "! 👋";
  document.getElementById('userPhoneDisplay').innerText = info;

  document.getElementById('authScreen').classList.remove('active');
  document.getElementById('otpScreen').classList.remove('active');
  document.getElementById('homeScreen').classList.add('active');
  document.getElementById('bottomNav').style.display = 'flex';
};

window.onload = function() {
  const saved = localStorage.getItem('ff_username');
  if (saved) handleSuccessfulLogin(saved, localStorage.getItem('ff_info'));
};

window.logout = function() {
  localStorage.clear();
  auth.signOut();
  location.reload();
};
</script>

<script>
function switchTab(tab, el) {
  document.querySelectorAll('.app-body > .screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById(tab + 'Screen').classList.add('active');
  el.classList.add('active');
}

function backToAuth() {
  document.getElementById('otpScreen').classList.remove('active');
  document.getElementById('authScreen').classList.add('active');
}
</script>
</body>
</html>
